# Resume/CV AI - Docker Compose Configuration
# Multi-service setup for development and production environments

version: '3.8'

# =============================================================================
# Services Configuration
# =============================================================================
services:
  # Main Application Service
  resumeai-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: resumeai-app
    ports:
      - "8501:8501"
    environment:
      # Application Configuration
      - APP_NAME=Resume/CV AI Assistant
      - APP_VERSION=1.0.0
      - APP_DEBUG=true
      - APP_ENVIRONMENT=development
      
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8501
      - DEBUG=true
      
      # Database Configuration
      - DATABASE_URL=postgresql://resume_ai:resume_ai_password@postgres:5432/resume_ai_db
      
      # Redis Configuration
      - REDIS_URL=redis://redis:6379/0
      
      # AI API Keys (Set these in .env file)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Vector Database Configuration
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
      - CHROMA_COLLECTION_NAME=resume_ai_collection
      
      # Logging Configuration
      - LOG_LEVEL=INFO
      - DEBUG_LOGGING=true
      
      # Feature Flags
      - ENABLE_AI_ANALYSIS=true
      - ENABLE_VECTOR_SEARCH=true
      - ENABLE_PDF_EXPORT=true
      
    volumes:
      # Application data persistence
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./temp:/app/temp
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
      - ./chroma_db:/app/chroma_db
      - ./faiss_index:/app/faiss_index
      
      # Development volume (uncomment for development)
      # - .:/app
      
    depends_on:
      - postgres
      - redis
    networks:
      - resumeai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: resumeai-postgres
    environment:
      - POSTGRES_DB=resume_ai_db
      - POSTGRES_USER=resume_ai
      - POSTGRES_PASSWORD=resume_ai_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - resumeai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_ai -d resume_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: resumeai-redis
    command: redis-server --appendonly yes --requirepass redis_password
    environment:
      - REDIS_PASSWORD=redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - resumeai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: resumeai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - resumeai-app
    networks:
      - resumeai-network
    restart: unless-stopped
    profiles:
      - production

  # Prometheus Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: resumeai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - resumeai-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana Dashboard (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: resumeai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - resumeai-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Elasticsearch for Logging (Optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: resumeai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - resumeai-network
    restart: unless-stopped
    profiles:
      - logging

  # Kibana for Log Analysis (Optional)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: resumeai-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - resumeai-network
    restart: unless-stopped
    profiles:
      - logging

# =============================================================================
# Networks Configuration
# =============================================================================
networks:
  resumeai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# Volumes Configuration
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

# =============================================================================
# Development Override
# =============================================================================
# Create docker-compose.override.yml for development-specific settings
# This file is automatically loaded by docker-compose and overrides the main file

# =============================================================================
# Usage Instructions
# =============================================================================
#
# 1. Development Environment:
#    docker-compose up -d
#
# 2. Production Environment:
#    docker-compose --profile production up -d
#
# 3. With Monitoring:
#    docker-compose --profile monitoring up -d
#
# 4. With Logging:
#    docker-compose --profile logging up -d
#
# 5. All Services:
#    docker-compose --profile production --profile monitoring --profile logging up -d
#
# 6. Stop Services:
#    docker-compose down
#
# 7. Stop and Remove Volumes:
#    docker-compose down -v
#
# 8. View Logs:
#    docker-compose logs -f resumeai-app
#
# 9. Execute Commands:
#    docker-compose exec resumeai-app bash
#
# 10. Rebuild Services:
#    docker-compose build --no-cache
#
# =============================================================================
# Environment Variables
# =============================================================================
#
# Create a .env file in the project root with the following variables:
#
# # AI API Keys
# OPENAI_API_KEY=your_openai_api_key_here
# GOOGLE_API_KEY=your_google_api_key_here
# ANTHROPIC_API_KEY=your_anthropic_api_key_here
#
# # Database Configuration
# POSTGRES_PASSWORD=your_secure_password
# REDIS_PASSWORD=your_redis_password
#
# # Application Configuration
# APP_ENVIRONMENT=development
# LOG_LEVEL=INFO
#
# =============================================================================
# Ports Configuration
# =============================================================================
#
# Service Ports:
# - Resume AI App: 8501 (Streamlit)
# - PostgreSQL: 5432
# - Redis: 6379
# - Nginx: 80, 443
# - Prometheus: 9090
# - Grafana: 3000
# - Elasticsearch: 9200
# - Kibana: 5601
#
# =============================================================================
# Security Considerations
# =============================================================================
#
# 1. Change default passwords
# 2. Use environment variables for sensitive data
# 3. Enable SSL/TLS in production
# 4. Configure firewall rules
# 5. Regular security updates
# 6. Monitor logs for suspicious activity
#
# =============================================================================
# Performance Tuning
# =============================================================================
#
# 1. Adjust memory limits for services
# 2. Configure Redis memory policies
# 3. Tune PostgreSQL settings
# 4. Use SSD storage for databases
# 5. Configure log rotation
# 6. Monitor resource usage
#
# =============================================================================
